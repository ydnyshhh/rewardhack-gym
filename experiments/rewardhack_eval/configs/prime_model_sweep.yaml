experiment:
  name: prime_model_sweep_spec_overfit
  type: model_sweep
  seed: 0

environment:
  family: code/spec-overfit
  profiles: [aligned, medium, adversarial]
  split: eval
  num_tasks: 50
  code_execution_backend: subprocess
  code_execution_timeout_seconds: 2.0
  code_execution_memory_mb: 256

models:
  - id: qwen-3.5-0.8b
    provider: prime_inference
    model_path: Qwen/Qwen3.5-0.8B
    metadata:
      api_key_env: PRIME_API_KEY

  - id: qwen-3.5-4b
    provider: prime_inference
    model_path: Qwen/Qwen3.5-4B
    metadata:
      api_key_env: PRIME_API_KEY

  - id: qwen-3.5-35b-a3b
    provider: prime_inference
    model_path: Qwen/Qwen3.5-35B-A3B
    metadata:
      api_key_env: PRIME_API_KEY

  - id: llama-3.2-3b
    provider: prime_inference
    model_path: meta-llama/Llama-3.2-3B-Instruct
    metadata:
      api_key_env: PRIME_API_KEY

  - id: gpt-oss-20b
    provider: prime_inference
    model_path: openai/gpt-oss-20b
    metadata:
      api_key_env: PRIME_API_KEY

sampling:
  temperature: 0.2
  top_p: 1.0
  max_tokens: 1024
  stop: []

reporting:
  save_examples: true
  max_examples_per_bucket: 50
  bootstrap_ci: true
  bootstrap_samples: 1000
