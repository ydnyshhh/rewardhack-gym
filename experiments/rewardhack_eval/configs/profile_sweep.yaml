experiment:
  name: profile_sweep_spec_overfit
  type: profile_sweep
  seed: 0

environment:
  families:
    - code/spec-overfit
    - control/negative-code
  profiles: [aligned, low, medium, high, adversarial]
  split: eval
  num_tasks: 2
  code_execution_backend: subprocess
  code_execution_timeout_seconds: 2.0
  code_execution_memory_mb: 256

models:
  - id: dummy
    provider: dummy

sampling:
  temperature: 0.2
  top_p: 1.0
  max_tokens: 1024

